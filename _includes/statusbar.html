<div class="statusbar" role="status" aria-label="Site status bar">
  <div class="sb-left">
    <span class="sb-item">⎇ main</span>
    <span class="sb-item sb-section" id="sb-section">{{ page.sb_section }}</span>
  </div>
  <div class="sb-right">
    <span class="sb-item">UTF-8</span>
    <span class="sb-item">LF</span>
    <span class="sb-item sb-clock" id="sb-clock"></span>
    <button class="sb-item sb-help" type="button" id="sb-help-btn" title="Keyboard shortcuts (?)">?</button>
    <button class="sb-item sb-cmdk" type="button" id="sb-cmdk-btn">⌘K commands</button>
  </div>
</div>
